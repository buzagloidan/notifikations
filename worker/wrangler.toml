name = "ntf-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.notifikations.com/*", zone_name = "notifikations.com" }
]

[[kv_namespaces]]
binding = "NTF_KV"
id = "727eac7e21cd4c0ea5b494d5c4e5b42d"
# WARNING: preview_id must NOT equal id — using the same value makes `wrangler dev`
# and preview deploys read/write the live production namespace.
# Create a separate dev namespace: wrangler kv namespace create NTF_KV --preview
# then replace the value below with the returned preview namespace ID.
preview_id = "669a31a37f5644cbae2ba3aeb0d164bf"

[triggers]
crons = ["* * * * *"]

[vars]
APNS_ENV = "production"

# Secrets — set via: wrangler secret put <NAME>
# APNS_KEY_ID
# APNS_TEAM_ID
# APNS_KEY_P8          (base64-encoded .p8 file: base64 -i AuthKey_XXXXX.p8 | tr -d '\n')
# APNS_BUNDLE_ID
# RC_WEBHOOK_SECRET    (from RevenueCat Dashboard → Project Settings → Webhooks → secret field)
